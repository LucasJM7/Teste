<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2a66b4" />

  <title>CrecheNow - Secretaria</title>

  <!-- PWA -->
  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" type="image/png" href="../assets/img/icons/icon-192x192.png" />

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body>
  <!-- ======================================================
       HEADER: Barra superior
       ====================================================== -->
  <header class="navbar navbar-expand-lg bg-primary text-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-white" href="#">
        CRECHENOW
      </a>

      <div class="d-flex align-items-center gap-3">
        <!-- Identificação do perfil logado -->
        <span class="text-white small">Secretaria</span>

        <!-- Botão que abre os recados enviados pelos pais -->
        <button class="btn btn-light position-relative" id="openParentMsgsBtn" aria-label="Recados dos pais">
          Recados
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" id="parentMsgsBadge">0</span>
        </button>

        <button class="btn btn-outline-light btn-sm" id="logoutBtn">Sair</button>
      </div>
    </div>
  </header>

  <!-- ======================================================
       MAIN: Conteúdo principal
       ====================================================== -->
  <main class="dashboard-main">
    <div class="dashboard-row">

      <!-- --------------------------------------------------
           COLUNA LATERAL: Formulários de ação rápida
           -------------------------------------------------- -->
      <aside class="side-column">
        <!-- Card: Novo Comunicado -->
        <section class="card shadow-sm" aria-labelledby="novoComunicadoTitle">
          <div class="card-header bg-primary text-white">
            <h2 class="h6 mb-0" id="novoComunicadoTitle">Novo Comunicado</h2>
          </div>
          <div class="card-body">
            <!-- Formulário de envio de comunicado -->
            <form id="staffForm" novalidate>
              <!-- Seleção do tipo de comunicado -->
              <div class="mb-2">
                <label class="form-label small">Tipo</label>
                <div class="d-flex gap-2 flex-wrap">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="notifyType" id="typeGeral" value="geral" checked />
                    <label class="form-check-label small" for="typeGeral">Geral</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="notifyType" id="typeSaude" value="saude" />
                    <label class="form-check-label small" for="typeSaude">Saúde</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="notifyType" id="typePedagogico" value="pedagogico" />
                    <label class="form-check-label small" for="typePedagogico">Pedagógico</label>
                  </div>
                </div>
              </div>

              <!-- Seleção do público-alvo -->
              <div class="mb-2">
                <label class="form-label small">Público</label>
                <select class="form-select form-select-sm" id="notifyTarget">
                  <option value="all">Todas as turmas</option>
                  <option value="A">Turma A</option>
                  <option value="B">Turma B</option>
                </select>
              </div>

              <!-- Título do comunicado -->
              <div class="mb-2">
                <label for="notifyTitle" class="form-label small">Título</label>
                <input type="text" class="form-control form-control-sm" id="notifyTitle" required />
              </div>

              <!-- Data e hora do comunicado -->
              <div class="row mb-2">
                <div class="col-6">
                  <label for="notifyDate" class="form-label small">Data</label>
                  <input type="date" class="form-control form-control-sm" id="notifyDate" required />
                </div>
                <div class="col-6">
                  <label for="notifyTime" class="form-label small">Hora</label>
                  <input type="time" class="form-control form-control-sm" id="notifyTime" required />
                </div>
              </div>

              <!-- Corpo da mensagem -->
              <div class="mb-3">
                <label for="notifyBody" class="form-label small">Mensagem</label>
                <textarea class="form-control form-control-sm" id="notifyBody" rows="3" required></textarea>
              </div>

              <button type="submit" class="btn btn-primary w-100 btn-sm">Enviar Comunicado</button>
            </form>
          </div>
        </section>

        <!-- Card: Ações Rápidas (placeholders para expansão futura) -->
        <section class="card shadow-sm" aria-labelledby="acoesRapidasTitle">
          <div class="card-header bg-secondary text-white">
            <h2 class="h6 mb-0" id="acoesRapidasTitle">Ações Rápidas</h2>
          </div>
          <div class="card-body d-grid gap-2">
            <!-- Botões que abrem modais de edição (JS implementará depois) -->
            <button class="btn btn-outline-primary" id="openAgendaEditorBtn">Editar Agenda</button>
            <button class="btn btn-outline-success" id="openCardapioEditorBtn">Editar Cardápio</button>
            <button class="btn btn-outline-info" id="openAddStudentBtn">Cadastrar Aluno</button>
          </div>
        </section>
      </aside>

      <!-- --------------------------------------------------
           COLUNA CENTRAL: Histórico e Gestão
           -------------------------------------------------- -->
      <section class="center-column">
        <!-- Card: Histórico de Comunicados Enviados -->
        <article class="card shadow-sm" aria-labelledby="historicoTitle">
          <div class="card-header bg-primary text-white">
            <h2 class="h6 mb-0" id="historicoTitle">Histórico de Envios</h2>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Assunto</th>
                    <th>Tipo</th>
                    <th>Data/Hora</th>
                  </tr>
                </thead>
                <!-- Corpo da tabela preenchido pelo JS -->
                <tbody id="sentNotificationsList">
                  <tr><td colspan="3" class="text-center text-muted">Nenhum comunicado enviado.</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </article>

        <!-- Card: Gestão de Alunos (placeholder para expansão) -->
        <article class="card shadow-sm" aria-labelledby="alunosTitle">
          <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
            <h2 class="h6 mb-0" id="alunosTitle">Alunos</h2>
            <button class="btn btn-sm btn-light" id="openAddStudentBtn2">+ Adicionar</button>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Nome</th>
                    <th>Turma</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody id="studentsList">
                  <tr><td colspan="3" class="text-center text-muted">Carregando alunos...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </article>
      </section>
    </div>
  </main>

  <!-- ======================================================
       MODAL: Cadastrar Novo Aluno
       ====================================================== -->
  <div class="modal-overlay" id="addStudentModal" role="dialog" aria-modal="true" aria-labelledby="addStudentTitle">
    <div class="modal-box">
      <button class="modal-close" data-close-modal aria-label="Fechar">×</button>
      <h3 class="h4 mb-3" id="addStudentTitle">Cadastrar Novo Aluno</h3>

      <form id="addStudentForm" novalidate>
        <div class="mb-3">
          <label for="newStudentName" class="form-label">Nome Completo</label>
          <input type="text" class="form-control" id="newStudentName" required />
        </div>
        <div class="mb-3">
          <label for="newStudentClass" class="form-label">Turma</label>
          <select class="form-select" id="newStudentClass" required>
            <option value="A">Turma A</option>
            <option value="B">Turma B</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="newStudentParentEmail" class="form-label">E-mail do Responsável</label>
          <input type="email" class="form-control" id="newStudentParentEmail" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
      </form>
    </div>
  </div>

  <!-- ======================================================
       MODAL: Editar Agenda (placeholder - JS preencherá depois)
       ====================================================== -->
  <div class="modal-overlay" id="agendaEditorModal" role="dialog" aria-modal="true" aria-labelledby="agendaEditorTitle">
    <div class="modal-box">
      <button class="modal-close" data-close-modal aria-label="Fechar">×</button>
      <h3 class="h4 mb-3" id="agendaEditorTitle">Editar Agenda Semanal</h3>

      <!-- Container onde os itens da agenda serão renderizados -->
      <div id="agendaEditorContainer" class="mb-3"></div>

      <button class="btn btn-outline-primary btn-sm mb-3" id="addAgendaItemBtn">+ Adicionar Item</button>

      <form id="agendaEditorForm">
        <button type="submit" class="btn btn-primary w-100">Salvar Agenda</button>
      </form>
    </div>
  </div>

  <!-- ======================================================
       MODAL: Editar Cardápio (placeholder)
       ====================================================== -->
  <div class="modal-overlay" id="cardapioEditorModal" role="dialog" aria-modal="true" aria-labelledby="cardapioEditorTitle">
    <div class="modal-box">
      <button class="modal-close" data-close-modal aria-label="Fechar">×</button>
      <h3 class="h4 mb-3" id="cardapioEditorTitle">Editar Cardápio Semanal</h3>

      <div id="cardapioEditorContainer" class="mb-3"></div>

      <button class="btn btn-outline-success btn-sm mb-3" id="addCardapioItemBtn">+ Adicionar Item</button>

      <form id="cardapioEditorForm">
        <button type="submit" class="btn btn-success w-100">Salvar Cardápio</button>
      </form>
    </div>
  </div>

  <!-- ======================================================
       MODAL: Recados dos Pais (inbox da secretaria)
       ====================================================== -->
  <div class="modal-overlay" id="parentMsgsModal" role="dialog" aria-modal="true" aria-labelledby="parentMsgsTitle">
    <div class="modal-box">
      <button class="modal-close" data-close-modal aria-label="Fechar">×</button>
      <h3 class="h4 mb-3" id="parentMsgsTitle">Recados dos Responsáveis</h3>
      <!-- Lista de recados preenchida pelo JS -->
      <div id="parentMsgsContent" class="overflow-auto" style="max-height: 60vh;"></div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
