<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2a66b4" />
  <title>CrecheNow - Secretaria</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" type="image/png" href="../assets/img/icons/icon-192x192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body>
  <header class="navbar navbar-expand-lg bg-primary text-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-white" href="#">CRECHENOW</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white small fw-bold">Painel da Secretaria</span>
        <button class="btn btn-outline-light btn-sm" id="logoutBtn">Sair</button>
      </div>
    </div>
  </header>
  <main class="dashboard-main">
    <div class="dashboard-row">
      <aside class="side-column">
        <section class="card shadow-sm mb-3">
          <div class="card-header bg-primary text-white"><h2 class="h6 mb-0">Novo Comunicado</h2></div>
          <div class="card-body">
            <form id="staffForm" novalidate>
              <div class="mb-3">
                <label class="form-label small fw-bold">Tipo de Comunicado</label>
                <div class="d-flex gap-3">
                  <div class="form-check"><input class="form-check-input" type="radio" name="notifyType" id="typeGeral" value="geral" checked /><label class="form-check-label" for="typeGeral">Geral</label></div>
                  <div class="form-check"><input class="form-check-input" type="radio" name="notifyType" id="typeSaude" value="saude" /><label class="form-check-label" for="typeSaude">Saude</label></div>
                  <div class="form-check"><input class="form-check-input" type="radio" name="notifyType" id="typePedagogico" value="pedagogico" /><label class="form-check-label" for="typePedagogico">Pedagogico</label></div>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label small fw-bold">Publico-Alvo</label>
                <select class="form-select" id="notifyTarget">
                  <option value="all">Todas as turmas</option>
                  <option value="A">Turma A</option>
                  <option value="B">Turma B</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="notifyTitle" class="form-label small fw-bold">Titulo</label>
                <input type="text" class="form-control" id="notifyTitle" required />
              </div>
              <div class="row mb-3">
                <div class="col-6"><label for="notifyDate" class="form-label small fw-bold">Data</label><input type="date" class="form-control" id="notifyDate" required /></div>
                <div class="col-6"><label for="notifyTime" class="form-label small fw-bold">Hora</label><input type="time" class="form-control" id="notifyTime" required /></div>
              </div>
              <div class="mb-3">
                <label for="notifyBody" class="form-label small fw-bold">Mensagem</label>
                <textarea class="form-control" id="notifyBody" rows="3" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary w-100">Enviar Comunicado</button>
            </form>
          </div>
        </section>
        <section class="card shadow-sm">
          <div class="card-header bg-secondary text-white"><h2 class="h6 mb-0">Acoes Rapidas</h2></div>
          <div class="card-body d-grid gap-2">
            <button class="btn btn-outline-info" id="openAddStudentBtn">Cadastrar Novo Aluno</button>
          </div>
        </section>
      </aside>
      <section class="center-column">
        <article class="card shadow-sm mb-3">
          <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center"><h2 class="h6 mb-0">Gestao de Alunos</h2></div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0 align-middle">
                <thead class="table-light"><tr><th>Nome</th><th>Turma</th><th>Responsavel</th><th class="text-end">Acoes</th></tr></thead>
                <tbody id="studentsList"><tr><td colspan="4" class="text-center text-muted p-3">Carregando alunos...</td></tr></tbody>
              </table>
            </div>
          </div>
        </article>
        <article class="card shadow-sm">
          <div class="card-header bg-success text-white"><h2 class="h6 mb-0">Historico de Comunicados Enviados</h2></div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-sm table-hover mb-0">
                <thead class="table-light"><tr><th>Assunto</th><th>Tipo</th><th>Data/Hora</th></tr></thead>
                <tbody id="sentNotificationsList"><tr><td colspan="3" class="text-center text-muted p-3">Nenhum comunicado enviado.</td></tr></tbody>
              </table>
            </div>
          </div>
        </article>
      </section>
    </div>
  </main>
  <div class="modal-overlay" id="addStudentModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button class="modal-close" data-close-modal aria-label="Fechar">×</button>
      <h3 class="h4 mb-3">Cadastrar Novo Aluno</h3>
      <form id="addStudentForm" novalidate>
        <div class="mb-3"><label class="form-label">Nome Completo</label><input type="text" class="form-control" id="newStudentName" required /></div>
        <div class="mb-3"><label class="form-label">Turma</label><select class="form-select" id="newStudentClass" required><option value="A">Turma A</option><option value="B">Turma B</option></select></div>
        <div class="mb-3"><label class="form-label">E-mail do Responsavel</label><input type="email" class="form-control" id="newStudentParentEmail" required /></div>
        <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
      </form>
    </div>
  </div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
