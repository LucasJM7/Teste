<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2a66b4" />
  <title>CrecheNow - Painel dos Pais</title>

  <link rel="manifest" href="../config/manifest.json" />
  <link rel="icon" type="image/png" href="../assets/img/icons/icon-192x192.png" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body>
  <header class="navbar navbar-expand-lg bg-primary text-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-white" href="#">CRECHENOW</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white small" id="userNameDisplay">Responsavel</span>
        <button class="btn btn-light position-relative" id="openInboxModalBtn" aria-label="Abrir mensagens">
          Mensagens
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" id="inboxBadge">0</span>
        </button>
        <button class="btn btn-outline-light btn-sm" id="logoutBtn">Sair</button>
      </div>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="dashboard-row">
      <aside class="side-column">
        <section class="card shadow-sm" aria-labelledby="agendaTitle">
          <div class="card-header bg-primary text-white">
            <h2 class="h6 mb-0" id="agendaTitle">Agenda Semanal</h2>
          </div>
          <div class="card-body" id="agendaContainer">
            <p class="text-muted text-center">Carregando agenda...</p>
          </div>
        </section>

        <section class="card shadow-sm" aria-labelledby="cardapioTitle">
          <div class="card-header bg-success text-white">
            <h2 class="h6 mb-0" id="cardapioTitle">Cardapio Semanal</h2>
          </div>
          <div class="card-body" id="cardapioContainer">
            <p class="text-muted text-center">Carregando cardapio...</p>
          </div>
        </section>
      </aside>

      <section class="center-column">
        <article class="card shadow-sm" aria-labelledby="comunicadosTitle">
          <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
            <h2 class="h6 mb-0" id="comunicadosTitle">Comunicados</h2>
            <div class="btn-group btn-group-sm" role="group">
              <button class="btn btn-outline-dark active" data-filter="todos">Todos</button>
              <button class="btn btn-outline-dark" data-filter="saude">Saude</button>
              <button class="btn btn-outline-dark" data-filter="pedagogico">Pedagogico</button>
            </div>
          </div>
          <div class="card-body p-0">
            <div id="notificationsCarousel" class="carousel slide notifications-carousel-wrapper" data-bs-ride="carousel">
              <div class="carousel-inner" id="notificationsFeed">
                <p class="text-muted text-center p-4">Carregando comunicados...</p>
              </div>
              <button class="carousel-control-prev" type="button" data-bs-target="#notificationsCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
              </button>
              <button class="carousel-control-next" type="button" data-bs-target="#notificationsCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Proximo</span>
              </button>
            </div>
          </div>
        </article>

        <article class="card shadow-sm routine-card-fixed" aria-labelledby="rotinaTitle">
          <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
            <h2 class="h6 mb-0" id="rotinaTitle">Rotina de Hoje</h2>
            <button class="btn btn-sm btn-light" id="toggleRoutineHistory">Ver Historico</button>
          </div>
          <div class="card-body" id="routineContainer">
            <p class="text-muted text-center">Carregando...</p>
          </div>
          <div id="routine-history" class="card-body d-none border-top">
            <h3 class="h6 mb-2">Historico</h3>
            <div id="routineHistoryList"></div>
          </div>
        </article>
      </section>
    </div>
  </main>

  <div class="position-fixed bottom-0 end-0 p-3 d-flex flex-column gap-2" style="z-index: 1040;">
    <button class="btn btn-primary shadow" id="openMsgModalBtn">Enviar Recado</button>
  </div>

  <div class="modal-overlay" id="msgModal" role="dialog" aria-modal="true" aria-labelledby="msgModalTitle">
    <div class="modal-box">
      <button class="modal-close" data-close-modal aria-label="Fechar">×</button>
      <h3 class="h4 mb-3" id="msgModalTitle">Enviar Recado para a Creche</h3>
      <form id="parentMsgForm" novalidate>
        <div class="mb-3">
          <label for="childName" class="form-label">Nome da Crianca</label>
          <input type="text" class="form-control" id="childName" readonly />
        </div>
        <div class="mb-3">
          <label for="parentMessage" class="form-label">Mensagem</label>
          <textarea class="form-control" id="parentMessage" rows="4" required></textarea>
          <div class="invalid-feedback">Escreva uma mensagem.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Enviar Recado</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="inboxModal" role="dialog" aria-modal="true" aria-labelledby="inboxModalTitle">
    <div class="modal-box">
      <button class="modal-close" data-close-modal aria-label="Fechar">×</button>
      <h3 class="h4 mb-3" id="inboxModalTitle">Minhas Mensagens</h3>
      <ul class="nav nav-tabs mb-3" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-inbox-tab="received" type="button">Recebidas</button></li>
        <li class="nav-item"><button class="nav-link" data-inbox-tab="sent" type="button">Enviadas</button></li>
      </ul>
      <div id="inbox-content" class="overflow-auto" style="max-height: 50vh;"></div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
