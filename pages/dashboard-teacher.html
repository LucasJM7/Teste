<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2a66b4" />
  <title>CrecheNow - Painel do Professor</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" type="image/png" href="../assets/img/icons/icon-192x192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body>
  <header class="navbar navbar-expand-lg bg-primary text-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-white" href="#">CRECHENOW</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white small" id="teacherInfo">Professor</span>
        <button class="btn btn-outline-light btn-sm" id="logoutBtn">Sair</button>
      </div>
    </div>
  </header>
  <main class="dashboard-main">
    <div class="dashboard-row">
      <aside class="side-column">
        <section class="card shadow-sm">
          <div class="card-header bg-primary text-white"><h2 class="h6 mb-0">Minha Turma <span id="teacherClassDisplay"></span></h2></div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0 align-middle">
                <thead class="table-light"><tr><th>Nome</th><th class="text-center">Status</th></tr></thead>
                <tbody id="teacherStudentsList"><tr><td colspan="2" class="text-center text-muted p-3">Carregando...</td></tr></tbody>
              </table>
            </div>
          </div>
        </section>
      </aside>
      <section class="center-column">
        <article class="card shadow-sm">
          <div class="card-header bg-success text-white"><h2 class="h6 mb-0">Registro de Rotina Diaria</h2></div>
          <div class="card-body">
            <form id="teacherRoutineForm" novalidate>
              <div class="mb-3">
                <label for="routineStudentSelect" class="form-label fw-bold">Selecione o Aluno</label>
                <select class="form-select form-select-lg" id="routineStudentSelect" required>
                  <option value="">Escolha um aluno...</option>
                </select>
              </div>
              <div class="form-check form-switch mb-4 p-3 bg-light rounded border">
                <input class="form-check-input" type="checkbox" id="routineAttendance" style="transform: scale(1.2);" />
                <label class="form-check-label fw-bold text-primary" for="routineAttendance">
                  Deseja registrar a avaliacao deste aluno hoje?
                </label>
                <div class="form-text">Se desmarcado, o dia ficara em estado neutro (sem registro de presenca ou falta).</div>
              </div>
              <div id="routineQuestionsContainer" style="display: none;">
                <h3 class="h6 mb-3 text-secondary border-bottom pb-2">Avaliacao do Dia</h3>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label small fw-bold">Se comportou bem?</label>
                    <div class="btn-group w-100" role="group">
                      <input type="radio" class="btn-check" name="q1" id="q1sim" value="sim" checked />
                      <label class="btn btn-outline-success" for="q1sim">Sim</label>
                      <input type="radio" class="btn-check" name="q1" id="q1nao" value="nao" />
                      <label class="btn btn-outline-danger" for="q1nao">Nao</label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-bold">Prestou atencao?</label>
                    <div class="btn-group w-100" role="group">
                      <input type="radio" class="btn-check" name="q2" id="q2sim" value="sim" checked />
                      <label class="btn btn-outline-success" for="q2sim">Sim</label>
                      <input type="radio" class="btn-check" name="q2" id="q2nao" value="nao" />
                      <label class="btn btn-outline-danger" for="q2nao">Nao</label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-bold">Fez os deveres?</label>
                    <div class="btn-group w-100" role="group">
                      <input type="radio" class="btn-check" name="q3" id="q3sim" value="sim" checked />
                      <label class="btn btn-outline-success" for="q3sim">Sim</label>
                      <input type="radio" class="btn-check" name="q3" id="q3nao" value="nao" />
                      <label class="btn btn-outline-danger" for="q3nao">Nao</label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-bold">Se deu bem com colegas?</label>
                    <div class="btn-group w-100" role="group">
                      <input type="radio" class="btn-check" name="q4" id="q4sim" value="sim" checked />
                      <label class="btn btn-outline-success" for="q4sim">Sim</label>
                      <input type="radio" class="btn-check" name="q4" id="q4nao" value="nao" />
                      <label class="btn btn-outline-danger" for="q4nao">Nao</label>
                    </div>
                  </div>
                  <div class="col-12">
                    <label class="form-label small fw-bold">Comeu toda a comida?</label>
                    <div class="btn-group w-100" role="group">
                      <input type="radio" class="btn-check" name="q5" id="q5sim" value="sim" checked />
                      <label class="btn btn-outline-success" for="q5sim">Sim</label>
                      <input type="radio" class="btn-check" name="q5" id="q5nao" value="nao" />
                      <label class="btn btn-outline-danger" for="q5nao">Nao</label>
                    </div>
                  </div>
                </div>
                <div class="mb-3 mt-4">
                  <label for="routineComment" class="form-label fw-bold">Comentarios Adicionais (Opcional)</label>
                  <textarea class="form-control" id="routineComment" rows="3" placeholder="Ex: Hoje ele destacou-se na atividade de artes..."></textarea>
                </div>
              </div>
              <button type="submit" class="btn btn-success w-100 mt-3 py-2 fw-bold">Salvar Registro</button>
            </form>
          </div>
        </article>
      </section>
    </div>
  </main>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
